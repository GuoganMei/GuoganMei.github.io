<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>(function(){var l=localStorage.getItem('site-lang');if(l==='en')document.documentElement.lang='en';})();</script>
  <script>MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]},svg:{fontCache:'global'}};</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Markdown rendered content */
    #md-content h1 { font-size: 2rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-border); }
    #md-content h2 { font-size: 1.3rem; margin: 2rem 0 0.6rem; }
    #md-content h3 { font-size: 1.1rem; margin: 1.5rem 0 0.4rem; }
    #md-content p  { margin-bottom: 1rem; }
    #md-content ul, #md-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    #md-content li { margin-bottom: 0.25rem; }
    #md-content a  { color: var(--color-accent); text-underline-offset: 2px; }
    #md-content blockquote { border-left: 3px solid var(--color-border); padding-left: 1rem; color: var(--color-text-muted); margin: 1rem 0; }
    #md-content pre { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    #md-content code { font-family: "Courier New", monospace; font-size: 0.9em; }
    #md-content pre code { background: none; border: none; padding: 0; }
    #md-content img { max-width: 100%; border-radius: var(--radius); }
    #md-content table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    #md-content th, #md-content td { border: 1px solid var(--color-border); padding: 0.5rem 0.75rem; }
    #md-content th { background: var(--color-surface); font-weight: 600; }
    .viewer-back { font-family: var(--font-sans); font-size: 0.9rem; margin-bottom: 2rem; display: inline-block; color: var(--color-text-muted); text-decoration: none; }
    .viewer-back:hover { color: var(--color-accent); }
    #md-error { color: #c00; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="site-name" href="index.html">Your Name</a>
      <a href="about.html"><span class="zh">关于我</span><span class="en">About</span></a>
      <a href="publications.html"><span class="zh">出版物</span><span class="en">Publications</span></a>
      <a href="projects.html"><span class="zh">项目</span><span class="en">Projects</span></a>
      <a href="blog.html"><span class="zh">博客</span><span class="en">Blog</span></a>
      <a href="archive.html"><span class="zh">档案</span><span class="en">Archive</span></a>
      <a href="stats.html"><span class="zh">统计</span><span class="en">Stats</span></a>
      <button id="lang-toggle" aria-label="Switch language">EN</button>
    </nav>
  </header>

  <main>
    <section class="page-content">
      <a class="viewer-back" id="back-link" href="javascript:history.back()">← <span class="zh">返回</span><span class="en">Back</span></a>
      <div id="md-content"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Your Name &nbsp;·&nbsp; your@email.com</p>
  </footer>
  <script src="js/lang.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get('file');
      var container = document.getElementById('md-content');

      if (!file) {
        container.innerHTML = '<p id="md-error">未指定文件。请在 URL 中添加 <code>?file=路径/文件.md</code></p>';
        return;
      }

      fetch(file)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          container.innerHTML = marked.parse(text);
          // 触发 MathJax 重新渲染
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([container]);
          }
        })
        .catch(function (err) {
          container.innerHTML = '<p id="md-error">无法加载文件：' + file + '<br>' + err.message + '</p>';
        });
    })();
  </script>
</body>
</html>
